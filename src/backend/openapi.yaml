openapi: 3.0.0
info:
  title: Nightfall API
  description: API for Nightfall theme park experiences, reservations, and user management
  version: 1.0.0
servers:
  - url: http://localhost:5080/api
    description: Local development server
  - url: https://api.nightfall.example.com
    description: Production server

paths:
  /experiences:
    get:
      summary: Get all experiences
      description: >-
        Retrieve a list of available experiences. Archived experiences are
        omitted unless the caller is authenticated with an admin Bearer token.
      tags:
        - Guest
        - Member
      responses:
        '200':
          description: A list of experiences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Experience'
        '500':
          description: Internal server error

    post:
      summary: Create a new experience
      description: Add a new experience to the catalog (Admin only)
      tags:
        - Admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperienceInput'
      responses:
        '201':
          description: Experience created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error

  /experiences/search:
    get:
      summary: Search experiences
      description: >-
        Search experiences by free text (matched against name and
        description simultaneously), category, duration, intensity level,
        participant capacity, and price range. All parameters are optional
        and combine with AND. Archived experiences are omitted unless the
        caller is authenticated with an admin Bearer token.
      tags:
        - Guest
        - Member
      parameters:
        - name: q
          in: query
          description: Free text matched against name and description (substring, case-insensitive)
          schema:
            type: string
        - name: category
          in: query
          description: Exact category match
          schema:
            type: string
        - name: max_duration
          in: query
          description: Maximum duration, in minutes
          schema:
            type: integer
            minimum: 1
        - name: max_intensity_level
          in: query
          description: >-
            Maximum intensity level. Matches experiences with an
            intensity_level at or below this value.
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: participants
          in: query
          description: Minimum number of participants an experience must be able to accommodate
          schema:
            type: integer
            minimum: 1
        - name: min_price
          in: query
          description: Minimum price, in euros
          schema:
            type: number
            format: float
            minimum: 0
        - name: max_price
          in: query
          description: Maximum price, in euros
          schema:
            type: number
            format: float
            minimum: 0
      responses:
        '200':
          description: A list of experiences matching the given filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Experience'
        '400':
          description: Invalid query parameter
        '500':
          description: Internal server error

  /experiences/{id}:
    get:
      summary: Get a specific experience
      description: >-
        Retrieve details of a single experience by ID. Returns 404 for an
        archived experience unless the caller is authenticated with an admin
        Bearer token.
      tags:
        - Guest
        - Member
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the experience to retrieve
          schema:
            type: integer
      responses:
        '200':
          description: Experience details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
        '404':
          description: Experience not found
        '500':
          description: Internal server error

    put:
      summary: Update an experience
      description: Update details of an existing experience (Admin only)
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the experience to update
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperienceInput'
      responses:
        '200':
          description: Experience updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Experience not found
        '500':
          description: Internal server error

    delete:
      summary: Delete an experience
      description: Remove an experience from the catalog (Admin only)
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the experience to delete
          schema:
            type: integer
      responses:
        '204':
          description: Experience deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Experience not found
        '500':
          description: Internal server error

  /experiences/{id}/toggle-archive:
    patch:
      summary: Toggle an experience's archived state
      description: Flips is_archived on the given experience (Admin only)
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the experience to toggle
          schema:
            type: integer
      responses:
        '200':
          description: Archived state toggled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Experience not found
        '500':
          description: Internal server error

  /users:
    get:
      summary: Get all users
      description: >-
        Retrieve every user, with each user's reservations (and each
        reservation's experience) nested under it (Admin only)
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of users with their nested reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUserWithReservations'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error

    post:
      summary: Create a new user
      description: Create a new user account (Admin only)
      tags:
        - Admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserInput'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Email already exists
        '500':
          description: Internal server error

  /users/{id}:
    delete:
      summary: Delete a user
      description: Delete a user by ID (Admin only)
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the user to delete
          schema:
            type: integer
      responses:
        '204':
          description: User deleted successfully
        '400':
          description: Invalid id
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: User not found
        '409':
          description: Cannot delete a user with existing reservations
        '500':
          description: Internal server error

  /auth/register:
    post:
      summary: Register a new user
      description: Create a new user account
      tags:
        - Guest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
        '409':
          description: Email already exists
        '500':
          description: Internal server error

  /auth/login:
    post:
      summary: Login a user
      description: Authenticate a user and return a JWT token
      tags:
        - Guest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              required:
                - email
                - password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token for authenticated requests
        '401':
          description: Invalid credentials
        '500':
          description: Internal server error

  /reservations:
    get:
      summary: Get user's reservations
      description: Retrieve all reservations for the authenticated user
      tags:
        - Member
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of the authenticated user's reservations, with each experience nested
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationWithExperience'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

    post:
      summary: Create a new reservation
      description: Reserve an experience for the authenticated user
      tags:
        - Member
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationInput'
      responses:
        '201':
          description: Reservation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '404':
          description: Experience not found
        '409':
          description: Reservation conflict (e.g., capacity exceeded)
        '500':
          description: Internal server error

  /reservations/{id}:
    delete:
      summary: Cancel a reservation
      description: Cancel a reservation for the authenticated user
      tags:
        - Member
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the reservation to cancel
          schema:
            type: integer
      responses:
        '204':
          description: Reservation cancelled successfully
        '400':
          description: Invalid id
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (e.g., not the reservation owner, or cancellation window has passed)
        '404':
          description: Reservation not found
        '500':
          description: Internal server error

components:
  schemas:
    Experience:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the experience
        name:
          type: string
          description: Name of the experience
        description:
          type: string
          description: Detailed description of the experience
        image:
          type: string
          format: uri
          description: URL of the experience image
        category:
          type: string
          description: Category of the experience (e.g., Survie, Horreur, Escape Game)
        duration:
          type: integer
          description: Duration in minutes
        intensity_level:
          type: integer
          minimum: 1
          maximum: 5
          description: >-
            Intensity level, from 1 (Faible) to 5 (Extrême). The frontend
            maps this integer to a word label for display.
        max_participants:
          type: integer
          description: Maximum number of participants
        price:
          type: number
          format: float
          description: Price in euros
        is_archived:
          type: boolean
          description: Whether the experience is active or archived
      required:
        - id
        - name
        - description
        - category
        - duration
        - intensity_level
        - max_participants
        - price
        - is_archived

    ExperienceInput:
      type: object
      properties:
        name:
          type: string
          description: Name of the experience
        description:
          type: string
          description: Detailed description of the experience
        image:
          type: string
          format: uri
          description: URL of the experience image
        category:
          type: string
          description: Category of the experience
        duration:
          type: integer
          description: Duration in minutes
        intensity_level:
          type: integer
          minimum: 1
          maximum: 5
          description: Intensity level, from 1 (Faible) to 5 (Extrême)
        max_participants:
          type: integer
          description: Maximum number of participants
        price:
          type: number
          format: float
          description: Price in euros
      required:
        - name
        - description
        - category
        - duration
        - intensity_level
        - max_participants
        - price

    User:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the user
        email:
          type: string
          format: email
          description: User's email address
        is_admin:
          type: boolean
          description: Whether the user has admin privileges
      required:
        - id
        - email
        - is_admin

    UserInput:
      type: object
      properties:
        email:
          type: string
          format: email
          description: User's email address
        password:
          type: string
          format: password
          description: User's password
        is_admin:
          type: boolean
          description: Whether the account should have admin privileges (server-controlled, ignored on public registration)
          default: false
      required:
        - email
        - password

    Reservation:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the reservation
        experience_id:
          type: integer
          description: ID of the reserved experience
        user_id:
          type: integer
          description: ID of the user who made the reservation
        date:
          type: string
          format: date-time
          description: Date and time of the reservation
        participants:
          type: integer
          description: Number of participants

      required:
        - id
        - experience_id
        - user_id
        - date
        - participants

    ReservationInput:
      type: object
      properties:
        experience_id:
          type: integer
          description: ID of the experience to reserve
        date:
          type: string
          format: date-time
          description: Date and time of the reservation
        participants:
          type: integer
          description: Number of participants
      required:
        - experience_id
        - date
        - participants

    ReservationWithExperience:
      type: object
      properties:
        id:
          type: integer
        date_time:
          type: string
          format: date-time
        participants:
          type: integer
        created_at:
          type: string
          format: date-time
        experience:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            image:
              type: string
              nullable: true
            category:
              type: string
            duration:
              type: integer
            price:
              type: string
          required:
            - id
            - name
      required:
        - id
        - date_time
        - participants
        - experience

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
