version: "3.8"

services:
  frontend:
    build: ./src/frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./src/backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file:
      - ./src/backend/.env
    depends_on:
      - database
    restart: unless-stopped

  database:
    image: postgres:15-alpine
    env_file:
      - .env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: