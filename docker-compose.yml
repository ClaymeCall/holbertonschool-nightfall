version: "3.8"

services:
  frontend:
    build: ./src/frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./src/backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file:
      - ./src/backend/.env
    depends_on:
      - database
    restart: unless-stopped

  database:
    build: ./src/database
    env_file:
      - ./src/database/.env.example
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  postgres_data: