services:
  frontend:
    build: ./src/frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    env_file:
      - ./src/frontend/.env
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./src/backend
    ports:
      - "${BACKEND_PORT:-5080}:5080"
    env_file:
      - ./src/backend/.env
    volumes:
      - ./src/backend:/app
      - /app/node_modules
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    build: ./src/database
    env_file:
      - ./src/database/.env
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
